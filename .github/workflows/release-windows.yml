name: windows-release

# Push a version tag (e.g. v0.3.1) -> GitHub builds ShimmerLive.exe on Windows, tests that it starts with
# everything it needs, and attaches ShimmerLive-<tag>-windows.zip to the GitHub Release of that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # also by hand (Actions tab): the zip is then kept as a build artifact only

permissions:
  contents: write           # to create the release and upload the zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.10"
      - name: Icon
        run: python packaging/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        run: python -m PyInstaller packaging/ShimmerLive.spec --noconfirm --distpath dist --workpath build
      - name: Test the .exe (starts, all plugins and libraries present, quits)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SHIMMER_LIVE_SMOKE_TEST: ${{ github.workspace }}\smoke_test.txt
        run: |
          $p = Start-Process -FilePath dist\ShimmerLive\ShimmerLive.exe -Wait -PassThru
          if (Test-Path smoke_test.txt) { Get-Content smoke_test.txt } else { Write-Output "no report written" }
          if ($p.ExitCode -ne 0) { throw "the built app failed its self-test (exit code $($p.ExitCode))" }
      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "ShimmerLive-$env:GITHUB_REF_NAME-windows.zip" } else { "ShimmerLive-windows.zip" }
          Compress-Archive -Path dist\ShimmerLive -DestinationPath $name
          "ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ShimmerLive-windows
          path: ${{ env.ZIP }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
