name: windows-release

# Push a version tag (e.g. v0.3.1) -> GitHub builds ShimmerLive.exe on Windows, tests that it starts with
# everything it needs, and attaches ShimmerLive-<tag>-windows.zip to the GitHub Release of that tag.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:        # also by hand (Actions tab): the zip is then kept as a build artifact only

permissions:
  contents: write           # to create the release and upload the zip

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r requirements.txt -c constraints-windows-compat.txt "pyinstaller>=6.10"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
      - name: Icon
        run: python packaging/make_icon.py
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Build
        shell: pwsh
        run: |
          # Do not bundle unrelated tool DLLs found on the runner's PATH.
          $python = (Get-Command python).Source
          $env:PATH = "$(Split-Path $python);$env:SystemRoot\System32;$env:SystemRoot"
          & $python -m PyInstaller packaging/ShimmerLive.spec --clean --noconfirm --distpath dist --workpath build
      - name: Test the .exe (starts, all plugins and libraries present, quits)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          SHIMMER_LIVE_SMOKE_TEST: ${{ github.workspace }}\smoke_test.txt
        run: |
          Remove-Item -LiteralPath smoke_test.txt -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath dist\ShimmerLive\ShimmerLive.exe -PassThru -WindowStyle Hidden
          if (-not $p.WaitForExit(60000)) {
            $p.Kill()
            throw "the built app did not finish its self-test within 60 seconds"
          }
          if ($p.ExitCode -ne 0) { throw "the built app failed its self-test (exit code $($p.ExitCode))" }
          if (-not (Test-Path smoke_test.txt)) { throw "the built app did not write a self-test report" }
          Get-Content smoke_test.txt
          if ((Get-Content smoke_test.txt -First 1) -ne 'SMOKE TEST OK') { throw "the built app did not pass its self-test" }
      - name: Record bundled package versions
        run: python -m pip freeze | Out-File -Encoding utf8 dist/ShimmerLive/build-packages.txt
      - name: Zip
        shell: pwsh
        run: |
          $name = if ($env:GITHUB_REF_TYPE -eq "tag") { "ShimmerLive-$env:GITHUB_REF_NAME-windows.zip" } else { "ShimmerLive-windows.zip" }
          Compress-Archive -Path dist\ShimmerLive -DestinationPath $name
          "ZIP=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: ShimmerLive-windows
          path: ${{ env.ZIP }}
      - name: Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
