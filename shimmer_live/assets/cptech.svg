<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="1024" height="1024">
  <!-- CPTech logo, vector redraw of cptech.jpg (200x200) so it stays sharp at any size. -->
  <defs>
    <style>
      .blue  { stroke: #1e7be6; stroke-width: 7.4; fill: none; stroke-linecap: butt; }
      .ecg   { stroke: #e53935; stroke-width: 2.6; fill: none; stroke-linejoin: round; stroke-linecap: round; }
      .ink   { stroke: #111111; stroke-width: 1.7; fill: none; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <!-- black frame, visible only in the corners outside the ring -->
  <rect x="11" y="11" width="178" height="178" fill="#ffffff" stroke="#111111" stroke-width="4.6"/>
  <circle cx="100" cy="100" r="99" fill="#ffffff"/>

  <!-- ring -->
  <circle cx="100" cy="100" r="94.8" class="blue"/>

  <!-- horizontal bars from the ring to the stem -->
  <line x1="6" y1="87" x2="85.5" y2="87" class="blue"/>
  <line x1="114.5" y1="87" x2="194" y2="87" class="blue"/>

  <!-- the hollow "Y": diagonals into two vertical bars -->
  <!-- the stem stays open down through the ring -->
  <rect x="89.2" y="150" width="21.6" height="50" fill="#ffffff"/>
  <polyline points="31,31 85.5,85.5 85.5,194" class="blue" stroke-linejoin="miter"/>
  <polyline points="169,31 114.5,85.5 114.5,194" class="blue" stroke-linejoin="miter"/>
  <line x1="30" y1="165" x2="85.5" y2="131" class="blue"/>
  <line x1="170" y1="165" x2="114.5" y2="131" class="blue"/>

  <!-- nodes with white halos that interrupt the ring -->
  <g fill="#1e7be6" stroke="#ffffff" stroke-width="3">
    <circle cx="31" cy="31" r="9.5"/>
    <circle cx="169" cy="31" r="9.5"/>
    <circle cx="30" cy="165" r="9.5"/>
    <circle cx="170" cy="165" r="9.5"/>
  </g>

  <!-- ECG traces -->
  <polyline class="ecg" points="12,125 30,125 33.5,121 37.5,145 46,96.5 50.5,124 55,115 59,125 80,125"/>
  <polyline class="ecg" points="120,125 140,125 145,106.5 150,132.5 157,120 161,125 186,125"/>

  <!-- brain with a chip -->
  <g class="ink" transform="translate(100 46) scale(1.14) translate(-100 -46)">
    <!-- left hemisphere -->
    <path d="M97.5,30 C95,26.5 89.5,26 87.5,29.5 C83.5,27.5 79,31 80.5,35.5 C76.5,36.5 75.5,42 78.5,44.5
             C75.5,47.5 76.5,53 80.5,54 C79.5,58.5 84,62 88,60.5 C89,64.5 95,65.5 97.5,62"/>
    <!-- right hemisphere -->
    <path d="M102.5,30 C105,26.5 110.5,26 112.5,29.5 C116.5,27.5 121,31 119.5,35.5 C123.5,36.5 124.5,42 121.5,44.5
             C124.5,47.5 123.5,53 119.5,54 C120.5,58.5 116,62 112,60.5 C111,64.5 105,65.5 102.5,62"/>
    <!-- folds -->
    <path d="M86,36 C88,37 89,39 88.5,41"/>
    <path d="M114,36 C112,37 111,39 111.5,41"/>
    <path d="M83,48 C86,48 87.5,50 87.5,52"/>
    <path d="M117,48 C114,48 112.5,50 112.5,52"/>
    <!-- chip -->
    <rect x="92.5" y="38.5" width="15" height="15" rx="1.2"/>
    <rect x="97" y="43" width="6" height="6"/>
    <!-- pins -->
    <line x1="97.5" y1="30" x2="97.5" y2="38.5"/>
    <line x1="102.5" y1="30" x2="102.5" y2="38.5"/>
    <line x1="97.5" y1="53.5" x2="97.5" y2="62"/>
    <line x1="102.5" y1="53.5" x2="102.5" y2="62"/>
    <line x1="88.5" y1="42" x2="92.5" y2="42"/>
    <line x1="88.5" y1="50" x2="92.5" y2="50"/>
    <line x1="107.5" y1="42" x2="111.5" y2="42"/>
    <line x1="107.5" y1="50" x2="111.5" y2="50"/>
  </g>
</svg>
